<div class="modal-backdrop" (click)="cerrar()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title"
       (click)="$event.stopPropagation()">
    <header class="modal-header">
      <div>
        <h2 id="form-title">{{ esEdicion ? 'Editar estudiante' : 'Nuevo estudiante' }}</h2>
        <p>Completa los datos del formulario.</p>
      </div>
      <button type="button" class="icon-button" aria-label="Cerrar" [disabled]="saving" (click)="cerrar()">×</button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <fieldset class="modal-body form-grid" [disabled]="saving">
        <label>
          Nombre
          <input
            formControlName="nombre"
            placeholder="Ej. Ana"
            autofocus
            [attr.aria-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid"
            [attr.aria-describedby]="form.controls.nombre.touched && form.controls.nombre.invalid ? 'error-nombre' : null"
          />
          @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
            <small class="field-error" id="error-nombre" role="alert">Ingresa un nombre válido (máx. 60 caracteres).</small>
          }
        </label>

        <label>
          Apellido
          <input formControlName="apellido" placeholder="Ej. Torres" />
          @if (form.controls.apellido.touched && form.controls.apellido.invalid) {
            <small class="field-error">Ingresa un apellido válido (máx. 60 caracteres).</small>
          }
        </label>

        <label>
          Edad
          <input formControlName="edad" type="number" min="3" max="100" />
          @if (form.controls.edad.touched && form.controls.edad.invalid) {
            <small class="field-error">La edad debe estar entre 3 y 100 años.</small>
          }
        </label>

        <label>
          Grado
          <input formControlName="grado" placeholder="Ej. 5° Primaria" />
          @if (form.controls.grado.touched && form.controls.grado.invalid) {
            <small class="field-error">Ingresa el grado (máx. 40 caracteres).</small>
          }
        </label>

        <label class="span-2">
          Correo
          <input formControlName="correo" type="email" placeholder="nombre@colegio.edu" />
          @if (form.controls.correo.touched && form.controls.correo.invalid) {
            <small class="field-error">Ingresa un correo electrónico válido.</small>
          }
        </label>

        <label>
          Estado
          <select formControlName="estado">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </label>
      </fieldset>

      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" [disabled]="saving" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving" [attr.aria-busy]="saving">
          @if (saving) {
            <span class="spinner spinner-light" aria-hidden="true"></span>
            Guardando…
          } @else {
            {{ esEdicion ? 'Guardar cambios' : 'Crear estudiante' }}
          }
        </button>
      </footer>
    </form>
  </div>
</div>
